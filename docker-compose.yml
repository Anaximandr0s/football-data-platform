# =============================================================================
# MatchLens: object storage (MinIO), event streaming (Kafka) and the services built on them
#   Start:  docker compose up -d        Stop:  docker compose down
# Later phases (Spark, Dagster, Streamlit...) are added HERE when someone starts them.
# =============================================================================
name: football-platform

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

volumes:
  minio-data:
  kafka-data:
  spark-ivy:   # Maven jars of the Silver job (S3A, Iceberg): downloaded once
  duckdb-ext:  # DuckDB extensions (httpfs, iceberg) of the Gold job: downloaded once
  dagster-storage:  # Dagster runs, event logs, schedules and sensor cursors (SQLite), shared by webserver and daemon
  prometheus-data:  # 7 days of metrics
  alertmanager-data:  # silences and what was already sent (no second email after a restart)
  grafana-data:

services:
  # --- MinIO: S3-compatible storage (buckets = bronze / silver / gold) ---------
  minio:
    <<: *common
    image: ${MINIO_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public   # metrics without a token: the port is on 127.0.0.1 only (monitoring/README.md)
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    mem_limit: 512m
    healthcheck:   # first tool present in the image answers; last resort = TCP connect
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || wget -q -O /dev/null http://localhost:9000/minio/health/live || bash -c 'exec 3<>/dev/tcp/localhost/9000'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the buckets listed in MINIO_BUCKETS, then exit (safe to re-run)
  minio-init:
    image: ${MINIO_MC_IMAGE}
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKETS: ${MINIO_BUCKETS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "waiting for minio..."; sleep 2
        done
        for b in $$(echo "$$BUCKETS" | tr ',' ' '); do
          mc mb --ignore-existing "local/$$b"
        done
        mc mb --ignore-existing local/checkpoints   # Spark Structured Streaming checkpoints
        echo "buckets ready"
    mem_limit: 128m

  # --- Kafka (KRaft, single node, no ZooKeeper) --------------------------------
  #   containers use kafka:9092 | scripts on your laptop use localhost:29092
  kafka:
    <<: *common
    image: ${KAFKA_IMAGE}
    hostname: kafka
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data      # on the volume: data survives restarts
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics exist only if listed in KAFKA_TOPICS
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: create every topic in KAFKA_TOPICS ("name:partitions,name:partitions")
  kafka-init:
    image: ${KAFKA_IMAGE}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TOPICS: ${KAFKA_TOPICS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          echo "waiting for kafka..."; sleep 2
        done
        for spec in $$(echo "$$TOPICS" | tr ',' ' '); do
          name=$${spec%%:*}; parts=$${spec##*:}
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$name" --partitions "$$parts" --replication-factor 1
        done
        # streaming output: one row per window, the latest value per key kept (log compaction)
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic foot-live-stats --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        echo "topics ready"
    mem_limit: 256m

  # --- Kafka UI: browse topics, messages, consumer groups ----------------------
  kafka-ui:
    <<: *common
    image: ${KAFKA_UI_IMAGE}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT}:8080"
    mem_limit: 512m

  # --- Bronze writer: Kafka -> MinIO bronze, always on (started by `make up`, restarted if it stops) ---------
  # Commits its Kafka offsets only after an upload, so its lag tells Dagster when a replay is fully in Bronze.
  bronze-writer:
    <<: *common
    build: ./ingestion
    image: football-bronze-writer:local
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KAFKA_EXTERNAL_BOOTSTRAP: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./:/app:ro
    mem_limit: 512m

  # --- Spark standalone cluster (Silver): 1 master + 1 worker ---------------------
  #   master UI: http://localhost:${SPARK_MASTER_UI_PORT}   cluster URL (inside Docker): spark://spark-master:7077
  spark-master:
    <<: *common
    image: ${SPARK_IMAGE:-apache/spark:4.0.5-scala2.13-java17-python3-ubuntu}
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    volumes:
      - ./monitoring/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    ports:
      - "127.0.0.1:${SPARK_MASTER_UI_PORT:-8082}:8080"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  spark-worker:
    <<: *common
    image: ${SPARK_IMAGE:-apache/spark:4.0.5-scala2.13-java17-python3-ubuntu}
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "4", "--memory", "2g", "--webui-port", "8081"]
    # 4 cores: streaming 2 + Silver 1 (+1 for a second Silver when the memory allows it)
    volumes:
      - ./monitoring/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    mem_limit: 2560m

  # One-shot driver of the Silver job (profile "jobs": not started by `docker compose up`).
  #   make silver MATCH="m001 m002"      or      docker compose --profile jobs run --rm silver --match m001
  # The repository is mounted in /app, so the code and data/prepared/<match>/manifest.json are the ones on your disk.
  # Runs as root only so the named volume spark-ivy is writable (local development stack).
  silver:
    profiles: ["jobs"]
    image: ${SPARK_IMAGE:-apache/spark:4.0.5-scala2.13-java17-python3-ubuntu}
    user: "0:0"
    working_dir: /app
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./:/app
      - spark-ivy:/tmp/ivy
    # Same jar versions as spark/silver/config.py (override both with SPARK_JARS_PACKAGES in .env).
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - ${SPARK_JARS_PACKAGES:-org.apache.hadoop:hadoop-aws:3.4.1,org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.10.0}
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --driver-memory
      - 1g
      - --executor-memory
      - 1g
      - /app/spark/silver/bronze_to_silver.py
      - --packages
      - ""
    command: ["--match", "m001"]
    mem_limit: 1536m

  # --- Streaming: Spark Structured Streaming (profile "jobs": `make streaming`, runs until stopped) ---
  # Reads the replay topics, writes the 5- and 15-minute live stats to the compacted topic foot-live-stats.
  # One core of the worker, so a `make silver` can run beside it. Checkpoints: s3a://checkpoints/streaming-5min.
  streaming:
    profiles: ["jobs"]
    image: ${SPARK_IMAGE:-apache/spark:4.0.5-scala2.13-java17-python3-ubuntu}
    user: "0:0"
    working_dir: /app
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PYTHONPATH: /app:/app/app/streamlit
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./:/app
      - spark-ivy:/tmp/ivy
      - ./monitoring/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0,org.apache.hadoop:hadoop-aws:3.4.1
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --conf
      - spark.cores.max=${STREAMING_CORES:-2}   # the 3 queries shared 1 core: batches 12.5 s -> 5 s with 2
      - --conf
      - spark.sql.streaming.metricsEnabled=true   # rows/s and batch duration of each query on :4040/metrics/prometheus
      - --conf
      - spark.metrics.namespace=streaming
      - --conf
      - spark.hadoop.fs.s3a.endpoint=http://minio:9000
      - --conf
      - spark.hadoop.fs.s3a.path.style.access=true
      - --conf
      - spark.hadoop.fs.s3a.connection.ssl.enabled=false
      - --conf
      - spark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER}
      - --conf
      - spark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD}
      - --py-files
      - /app/app/streamlit/clock.py
      - --driver-memory
      - 1g
      - --executor-memory
      - 768m
      - /app/spark/streaming/live_stats.py
    mem_limit: 1536m

  # --- Gold: dbt + DuckDB (profile "jobs": run on demand, not started by `docker compose up`) ---
  # DuckDB is an embedded engine, there is no server: it runs inside these two containers and keeps the Gold tables
  # in the file data/football.duckdb (also exported as Parquet to the MinIO bucket gold).
  #   make gold                       dbt build: staging + 6 Gold tables + tests + export to s3://gold
  #   make gold-sql Q="select ..."    query the Gold file (read-only)
  dbt:
    profiles: ["jobs"]
    build: ./dbt
    image: football-dbt:local
    working_dir: /app/dbt
    depends_on:
      minio:
        condition: service_healthy
    environment:
      DBT_TARGET: minio                     # httpfs + iceberg extensions, S3 settings (dbt/profiles.yml)
      GOLD_DUCKDB_PATH: /app/data/football.duckdb
      GOLD_S3_ENDPOINT: minio:9000          # host:port for DuckDB (no http://)
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./:/app
      - duckdb-ext:/root/.duckdb
    command: ["build", "--vars", "{export_gold: true}"]
    mem_limit: 1g

  duckdb:
    profiles: ["jobs"]
    build: ./dbt
    image: football-dbt:local
    working_dir: /app
    entrypoint: ["python", "/app/dbt/scripts/duckdb_query.py"]
    environment:
      GOLD_DUCKDB_PATH: /app/data/football.duckdb
    volumes:
      - ./:/app
    mem_limit: 512m

  # --- Soda checks on Silver and Gold (profile "jobs": on demand). Exit code 1 if a check fails: Dagster uses it to block. ---
  #   make soda | make soda-silver | make soda-gold | make soda-demo       results: data/soda/<layer>.json
  soda:
    profiles: ["jobs"]
    build: ./soda
    image: football-soda:local
    working_dir: /app
    depends_on:
      minio:
        condition: service_healthy
    environment:
      GOLD_DUCKDB_PATH: /app/data/football.duckdb
      GOLD_S3_ENDPOINT: minio:9000          # host:port for DuckDB (no http://)
      SODA_OUT_DIR: /app/data/soda
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./:/app
      - duckdb-ext:/root/.duckdb
    command: ["--layer", "all"]
    mem_limit: 1g

  # --- Dagster (profile "dagster": `make dagster`, UI on http://localhost:${DAGSTER_PORT}) -----------------------
  # One image for the webserver, the daemon and the runs. dagster-init writes dbt/target/manifest.json (dbt parse),
  # which the code location reads to build the Gold assets. Runs are queued and executed by the daemon: the Silver
  # Spark driver runs there, under the host name dagster-daemon that the workers use to reach it.
  dagster-init:
    profiles: ["dagster"]
    build: ./dagster
    image: football-dagster:local
    working_dir: /app/dbt
    environment: &dagster-env
      DBT_TARGET: minio
      GOLD_DUCKDB_PATH: /app/data/football.duckdb
      GOLD_S3_ENDPOINT: minio:9000
      SODA_OUT_DIR: /app/data/soda
      PIPELINE_OUT_DIR: /app/data/pipeline
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_EXTERNAL_BOOTSTRAP: kafka:9092
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: dagster-daemon
    volumes: &dagster-volumes
      - ./:/app
      - dagster-storage:/opt/dagster/home/storage
      - spark-ivy:/tmp/ivy
      - duckdb-ext:/root/.duckdb
    command: ["dbt", "parse"]

  dagster-webserver:
    <<: *common
    profiles: ["dagster"]
    image: football-dagster:local
    depends_on:
      dagster-init:
        condition: service_completed_successfully
    environment: *dagster-env
    volumes: *dagster-volumes
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/home/workspace.yaml"]
    ports:
      - "127.0.0.1:${DAGSTER_PORT:-3000}:3000"
    mem_limit: 1g

  dagster-daemon:
    <<: *common
    profiles: ["dagster"]
    image: football-dagster:local
    hostname: dagster-daemon
    depends_on:
      dagster-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    environment: *dagster-env
    volumes: *dagster-volumes
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]
    mem_limit: 4g

  # --- Streamlit dashboard (profile "app": `make app` starts it, `make app-stop` stops it) ---
  # Reads the Gold file data/football.duckdb and data/soda/*.json, mounted READ-ONLY. http://localhost:${APP_PORT}
  app:
    profiles: ["app"]
    build: ./app/streamlit
    image: football-app:local
    working_dir: /app/app/streamlit
    restart: unless-stopped
    environment:
      GOLD_DUCKDB_PATH: /app/data/football.duckdb
      SODA_OUT_DIR: /app/data/soda
      KAFKA_BOOTSTRAP: kafka:9092          # Live match page: one consumer reading the replay topics
      LIVE_METRICS_PORT: 9108              # its lag and delay, for Prometheus (not published)
    volumes:
      - ./:/app:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g

  # --- Monitoring (profile "monitoring": `make monitoring` starts it, `make monitoring-stop` stops it) -------------
  # Prometheus scrapes every 15 s and keeps 7 days; Alertmanager sends the emails; Grafana shows 4 dashboards.
  # Every setting is a file in monitoring/. UIs on 127.0.0.1 only. See monitoring/README.md.
  prometheus:
    <<: *common
    profiles: ["monitoring"]
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=7d", "--web.external-url=http://localhost:${PROMETHEUS_PORT:-9090}"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    mem_limit: 512m

  alertmanager:
    <<: *common
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.35.0
    entrypoint: ["/bin/sh", "/etc/alertmanager/src/entrypoint.sh"]
    environment:     # empty values stop the container with the name of the missing variable (entrypoint.sh)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3001}
      DAGSTER_URL: http://localhost:${DAGSTER_PORT:-3000}
      APP_URL: http://localhost:${APP_PORT:-8501}
      ALERTMANAGER_URL: http://localhost:${ALERTMANAGER_PORT:-9093}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager/src:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    mem_limit: 64m

  grafana:
    <<: *common
    profiles: ["monitoring"]
    image: grafana/grafana:13.3.2
    # never start with the default admin/admin: an empty password stops the container
    entrypoint: ["/bin/sh", "-c", "test -n \"$$GF_SECURITY_ADMIN_PASSWORD\" || { echo 'set GRAFANA_ADMIN_PASSWORD in .env' >&2; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/slo.json
      # only Prometheus is used: each other bundled plugin runs its own process (17-31 MiB each, measured)
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_DISABLE_PLUGINS: >-
        cloudwatch,elasticsearch,grafana-advisor-app,grafana-exploretraces-app,grafana-lokiexplore-app,
        grafana-metricsdrilldown-app,grafana-postgresql-datasource,grafana-pyroscope-app,grafana-pyroscope-datasource,
        influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin,grafana-azure-monitor-datasource,
        grafana-testdata-datasource
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    mem_limit: 512m   # measured 340 MiB at rest after drawing the dashboards (binary mapped in memory)

  node-exporter:     # the host machine
    <<: *common
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.13.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

  cadvisor:          # every container: CPU, memory against its limit, restarts
    <<: *common
    profiles: ["monitoring"]
    image: ghcr.io/google/cadvisor:v0.61.1
    command: ["--docker_only=true", "--housekeeping_interval=15s", "--store_container_labels=false",
              "--disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl"]
    privileged: true   # reads the cgroups of the other containers
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 512m   # peak 383 MiB over 7 days (270 MiB during a x60 replay): 384m ran at the limit

  kafka-exporter:    # topic offsets and consumer group lag (bronze-writer)
    <<: *common
    profiles: ["monitoring"]
    image: danielqsj/kafka-exporter:v1.11.0
    command: ["--kafka.server=kafka:9092", "--kafka.version=3.9.0"]
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 64m

  blackbox:          # do the app, Dagster, MinIO and Kafka answer?
    <<: *common
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    mem_limit: 64m

  pipeline-exporter: # our code: Dagster runs, dbt tests, Soda per dimension, Spark progress, Gold freshness
    <<: *common
    profiles: ["monitoring"]
    build: ./monitoring/exporter
    image: football-pipeline-exporter:local
    environment:
      PROJECT_ROOT: /app
      DAGSTER_GRAPHQL: http://dagster-webserver:3000/graphql
    volumes:
      - ./:/app:ro
    mem_limit: 256m

  # --- Control Center (profile "demo": `make demo`) -------------------------------------------------------------------
  # One page to run the demo: the architecture with live status, start and stop a replay, performance and quality.
  # Reads Prometheus, Dagster and the Gold file; runs the project's producer. http://localhost:${CONTROL_PORT:-8000}
  control-center:
    <<: *common
    profiles: ["demo"]
    build: ./app/api
    image: football-control-center:local
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PROMETHEUS_URL: http://prometheus:9090
      DAGSTER_GRAPHQL: http://dagster-webserver:3000/graphql
      GOLD_DUCKDB_PATH: /app/data/football.duckdb
      # the addresses a browser on this machine uses for the buttons
      APP_PORT: ${APP_PORT:-8501}
      GRAFANA_PORT: ${GRAFANA_PORT:-3001}
      KAFKA_UI_PORT: ${KAFKA_UI_PORT:-8081}
      SPARK_MASTER_UI_PORT: ${SPARK_MASTER_UI_PORT:-8082}
      SPARK_DRIVER_UI_PORT: "4040"
      MINIO_CONSOLE_PORT: ${MINIO_CONSOLE_PORT:-9001}
      DAGSTER_PORT: ${DAGSTER_PORT:-3000}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
      ALERTMANAGER_PORT: ${ALERTMANAGER_PORT:-9093}
    volumes:
      - ./:/app:ro
    ports:
      - "127.0.0.1:${CONTROL_PORT:-8000}:8000"
    mem_limit: 768m   # two producers at once load their match in memory

