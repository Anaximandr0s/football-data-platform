version: 2

# Gold. Each model states its grain; data_tests check the grain, the keys and the vocabularies.
# Cross-checks against Silver (counts, goals = score...) are in tests/assert_*.sql.
models:
  - name: gold_player_match_stats
    description: >
      GRAIN: one row per player per match (FOO-04). Distance, speed and sprints cover tracked seconds only and come
      from 1 Hz positions: approximate. shots counts type 'shot' only; the shot map is shots + goals (see gold_shots).
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, player_id]
    columns:
      - name: team_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["HOME", "AWAY"]
      - name: distance_m
        description: "Sum of speed_kmh / 3.6 over tracked seconds (null speeds skipped)."
        data_tests: [not_null]
      - name: sprint_count
        description: "Sprint efforts: consecutive sprint seconds (> 25 km/h) count as one."
      - name: player_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_players')
                field: player_id
  - name: gold_team_match_stats
    description: "GRAIN: one row per team per match. Sums of gold_player_match_stats; possession is not in the source."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, team_id]
    columns:
      - name: team_id
        data_tests:
          - accepted_values:
              arguments:
                values: ["HOME", "AWAY"]
      - name: match_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_matches')
                field: match_id
  - name: gold_zone_occupancy
    description: "GRAIN: one row per player per zone per match (grid zones_x x zones_y, Silver frame). Tracked seconds only."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, player_id, zone_id]
    columns:
      - name: zone_id
        data_tests: [not_null]
  - name: gold_pass_network
    description: "GRAIN: one row per passer, receiver and match (passes with a known receiver)."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, passer_id, receiver_id]
  - name: gold_shots
    description: "GRAIN: one row per shot or goal. Goal attacked: x = 105 for HOME, x = 0 for AWAY."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: type
        data_tests:
          - accepted_values:
              arguments:
                values: ["shot", "goal"]
      - name: distance_to_goal_m
        data_tests: [not_null]
  - name: gold_player_5min
    description: "GRAIN: one row per player per 5-minute football window per match (0-5' ... 45+ ... 90+). coverage = tracked seconds / window_seconds."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, player_id, window_index]
    columns:
      - name: coverage
        data_tests: [not_null]

  # MatchLens tables (docs/product.md, section 7). Formulas: docs/product.md; columns: docs/contrat_donnees.md 10.3.
  - name: gold_match_timeline
    description: >
      GRAIN: one row per team per 5-minute football window per match (0-5' ... 40-45', 45+, 45-50' ... 90+), every
      window of the match (F1, F2, F7, E2).
      possession_greyed = fewer than 60 seconds with a known owner in the window.
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, team_id, window_index]
    columns:
      - name: team_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["HOME", "AWAY"]
      - name: possession_greyed
        data_tests: [not_null]
  - name: gold_player_card
    description: >
      GRAIN: one row per player per match (F3, F4, F5, F6, F8). Scores rank the eligible players (outfield, at least 20
      tracked minutes) of one match; other players have no scores.
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, player_id]
    columns:
      - name: source_player_id
        data_tests: [not_null]
      - name: is_eligible
        data_tests: [not_null]
      - name: player_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_players')
                field: player_id
  - name: gold_team_shape
    description: "GRAIN: one row per team per phase per match (C1, C2): means over tracked seconds, outfield players."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, team_id, phase]
    columns:
      - name: phase
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["in_possession", "out_of_possession", "unknown"]
  - name: gold_pressing
    description: "GRAIN: one row per team per 15-minute football window per match (0-15', 15-30', 30-45', 45+, 45-60' ... 90+) (C3)."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, team_id, window_index]
  - name: gold_team_build_up
    description: "GRAIN: one row per team per match (C4, C5)."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, team_id]
  - name: gold_player_fatigue
    description: "GRAIN: one row per player per match (C6). is_eligible carries the thresholds of C6; the others are greyed out."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, player_id]
    columns:
      - name: is_eligible
        data_tests: [not_null]
  - name: gold_space_control
    description: "GRAIN: one row per team per 5-minute football window with tracked seconds per match (S1)."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, team_id, window_index]
  - name: gold_team_profile
    description: "GRAIN: one row per team per match (C7, F7): whole-match team metrics and the F7 gaps."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, team_id]
  - name: gold_events
    description: "GRAIN: one row per event, runs included (E1, E2)."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: third
        data_tests:
          - accepted_values:
              arguments:
                values: ["own", "middle", "final"]
      - name: lane
        data_tests:
          - accepted_values:
              arguments:
                values: ["left", "centre", "right"]
  - name: gold_match_library
    description: "GRAIN: one row per stored match (Match library, Home): teams, score, kick-off date, competition, tracked share."
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: match_date
        data_tests: [not_null]
      - name: tracked_share
        data_tests: [not_null]

seeds:
  - name: team_names
    description: "The name fans use for each team of the SkillCorner open data (13 teams, checked in every match.json)."
    columns:
      - name: skillcorner_name
        data_tests: [unique, not_null]
      - name: fan_name
        data_tests: [unique, not_null]
