version: 2

# Intermediate models: inputs of several Gold tables, kept in the DuckDB file, not exported, not in the contract.
models:
  - name: int_team_shape_second
    description: "GRAIN: one row per team per tracked second per match (outfield players). Input of gold_team_shape and gold_team_profile."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, team_id, ts]
    columns:
      - name: phase
        data_tests:
          - accepted_values:
              arguments:
                values: ["in_possession", "out_of_possession", "unknown"]
  - name: int_space_control_second
    description: "GRAIN: one row per tracked second per match: HOME share of the 1 m cells (AWAY = 1 - home_share)."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, ts]
    columns:
      - name: home_share
        data_tests: [not_null]
  - name: int_football_windows
    description: "GRAIN: one row per window per size (300, 900 s) per match: the football windows (restart at each kick-off, 45+ and 90+ for stoppage time)."
    data_tests:
      - unique_combination:
          arguments:
            columns: [match_id, window_size, window_index]
