# Our numbers against official sources: the goal minute of every goal and the possession of every stored match.
# The one source of these facts: the Data quality page (Accuracy) and the Sources & limits page read this file.
#
# Rules (Data quality, Accuracy): a goal minute is exact when at least one source gives the same minute, and within
# 1 minute when the nearest source is one minute away (sources disagree among themselves). Possession is green within
# 1 point of at least one source, orange within 2, red further.
# Only what the sources say: our side is computed from Gold by the page (the goals of a match in time order, the minute
# from app/streamlit/clock.py on gold_events.ts; possession = gold_team_profile.possession_share of HOME), so a change
# in our data changes the result. tests/app/test_quality.py checks the scorers against Gold.
