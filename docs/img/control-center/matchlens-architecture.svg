<g class="legend" transform="translate(50,420)">
  <line x1="0" y1="0" x2="34" y2="0" class="edge live"/><text x="42" y="4">live: data in motion</text>
  <line x1="0" y1="22" x2="34" y2="22" class="edge stored"/><text x="42" y="26">stored: data at rest</text>
  <circle cx="17" cy="44" r="6" class="light green"/><text x="42" y="48">status (green: working)</text>
</g>
<text class="rowlabel" x="680" y="62">LIVE PATH</text>
<text class="rowlabel" x="660" y="380">STORED PATH</text>

