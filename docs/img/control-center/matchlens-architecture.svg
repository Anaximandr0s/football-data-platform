<svg id="arch" viewBox="0 0 1240 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MatchLens architecture: live path from SkillCorner to the Live page, stored path from Kafka to the analysis app" class="" width="1240" height="690">
<style>
  .bg{fill:#ffffff}
  .box rect.frame{fill:#ffffff;stroke:#2f3a33;stroke-width:1.2}
  .box{cursor:pointer}
  .box:hover rect.frame,.box:focus rect.frame{stroke:#146c34;stroke-width:2.2}
  .box .t{font:700 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#16201a}
  .box .s{font:12.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#4a564f}
  .box use{color:#2f3a33}
  .light{stroke:#ffffff;stroke-width:1.5}
  .light.green{fill:#2e9e5b}.light.orange{fill:#d97706}.light.red{fill:#c0392b}.light.grey{fill:#a7b0ab}
  .edge{fill:none;stroke-width:2.2}
  .edge.live{stroke:#00897b}
  .edge.stored{stroke:#7e57c2;stroke-dasharray:9 5}
  .edge.control{stroke:#7e57c2;stroke-dasharray:2 4;stroke-width:1.6}
  .moving .edge.live{stroke-dasharray:10 6;animation:flow .6s linear infinite}
  .moving-stored .edge.stored{animation:flow .6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-16}}
  .step circle{fill:#ffffff;stroke-width:1.5}
  .step.live circle{stroke:#00897b}.step.stored circle{stroke:#7e57c2}
  .step text{font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
  .step.live text{fill:#00695c}.step.stored text{fill:#5e35b1}
  .elabel{font:11.5px system-ui,sans-serif;fill:#4a564f}
  .band rect{fill:#f4f6f2;stroke:#a7b0ab;stroke-width:1;stroke-dasharray:4 3}
  .legend text{font:12.5px system-ui,sans-serif;fill:#16201a}
  .caption{font:italic 14px Georgia,"Times New Roman",serif;fill:#16201a;text-anchor:middle}
  .rowlabel{font:600 11px system-ui,sans-serif;letter-spacing:.12em;fill:#7a857f}
</style>
