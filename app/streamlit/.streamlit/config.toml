# MatchLens look: a stadium at night. Pitch green for actions, floodlight white for text; charts use the same
# background (viz.BG). White on the primary green is 5.0:1, body text on the background 16:1.
[theme]
base = "dark"
primaryColor = "#15803d"
backgroundColor = "#0b1410"
secondaryBackgroundColor = "#12221a"
textColor = "#e8f0ea"
borderColor = "#23392d"

[client]
toolbarMode = "viewer"   # a product, not a dev tool: no Deploy button
