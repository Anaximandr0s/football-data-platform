[tool.ruff]
line-length = 100
target-version = "py311"
# the dashboard imports its sibling modules (data, viz); without this, ruff's verdict depends on a local data/ folder
src = [".", "app/streamlit", "dagster"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["dagster"]   # the library, not the repository folder dagster/ of the same name

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# the Soda tests and some Dagster steps run project code in a child Python process
patch = ["subprocess"]
source = ["ingestion", "spark", "dbt", "soda", "dagster", "app", "monitoring", "scripts"]
# these scripts only run against the live Docker stack (load test, smoke test, screenshots)
omit = [
    "*/tests/*",
    "*/scripts/benchmark.py",
    "*/scripts/quality_evidence.py",
    "*/scripts/smoke_test.py",
    "*/scripts/control_center_thumbnails.py",
]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
show_missing = true
skip_covered = true
