[tool.ruff]
line-length = 100
target-version = "py311"
# the dashboard imports its sibling modules (data, viz); without this, ruff's verdict depends on a local data/ folder
src = [".", "app/streamlit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
