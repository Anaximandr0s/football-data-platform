name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish the GitHub release with notes from the merged pull requests
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "MatchLens $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
