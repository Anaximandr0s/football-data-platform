name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # same Java as the Spark image; Hadoop 3.4 in pyspark 4.0 calls Subject.getSubject, which JDK 24+ rejects
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q --cov --cov-report=
        env:
          COVERAGE_FILE: .coverage.main

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-main
          path: .coverage.main*
          include-hidden-files: true

      # the same Prometheus and Alertmanager images as docker-compose.yml check their own configs
      - name: Monitoring configs (promtool, amtool)
        run: |
          docker run --rm --entrypoint /bin/promtool -v $PWD/monitoring/prometheus:/etc/prometheus:ro \
            prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v $PWD/monitoring/prometheus:/etc/prometheus:ro -w /etc/prometheus/tests \
            prom/prometheus:v3.15.1 test rules alerts_test.yml
          mkdir -p /tmp/am
          sed -e 's|__SMTP_PORT__|587|; s|__[A-Z_]*__|x|g; s|/tmp/alertmanager/|/tmp/am/|g' \
            monitoring/alertmanager/alertmanager.yml.tmpl > /tmp/am/alertmanager.yml
          cp monitoring/alertmanager/email.tmpl /tmp/am/ && touch /tmp/am/smtp_password
          docker run --rm --entrypoint /bin/amtool -v /tmp/am:/tmp/am:ro prom/alertmanager:v0.34.2 \
            check-config /tmp/am/alertmanager.yml

  # Soda Core 3.5 pins duckdb==1.0.0, which cannot open the Gold file (DuckDB 2.0): it gets its own job and the same
  # install as soda/Dockerfile (connector WITHOUT its dependencies). The main job skips tests/soda: Soda is not installed there.
  soda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Soda Core with DuckDB 2.0
        run: |
          pip install "soda-core==3.5.6" "duckdb>=2.0,<2.1" pandas pyarrow pytest pytest-cov pyyaml
          pip install --no-deps "soda-core-duckdb==3.5.6"

      - name: Soda check tests
        run: python -m pytest tests/soda -q --cov --cov-report=
        env:
          COVERAGE_FILE: .coverage.soda

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-soda
          path: .coverage.soda*
          include-hidden-files: true

  # soda/run_checks.py is only exercised by the Soda job: the total is measured over both
  coverage:
    needs: [checks, soda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and require 90 %
        run: |
          pip install "coverage>=7.10"
          coverage combine
          coverage report --fail-under=90
