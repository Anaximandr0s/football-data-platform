name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# a new push to the same branch cancels the run it makes obsolete
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.17,<0.18"
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # same Java as the Spark image; Hadoop 3.4 in pyspark 4.0 calls Subject.getSubject, which JDK 24+ rejects
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q --cov --cov-report=
        env:
          COVERAGE_FILE: .coverage.main

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-main
          path: .coverage.main*
          include-hidden-files: true

  # Soda Core 3.5 pins duckdb==1.0.0, which cannot open the Gold file (DuckDB 2.0): it gets its own job and the same
  # install as soda/Dockerfile (connector WITHOUT its dependencies). The test job skips tests/soda: Soda is not installed there.
  soda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Soda Core with DuckDB 2.0
        run: |
          pip install "soda-core==3.5.6" "duckdb>=2.0,<2.1" pandas pyarrow pytest pytest-cov pyyaml
          pip install --no-deps "soda-core-duckdb==3.5.6"

      - name: Soda check tests
        run: python -m pytest tests/soda -q --cov --cov-report=
        env:
          COVERAGE_FILE: .coverage.soda

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-soda
          path: .coverage.soda*
          include-hidden-files: true

  # soda/run_checks.py is only exercised by the Soda job: the total is measured over both
  coverage:
    needs: [test, soda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and require 90 %
        run: |
          pip install "coverage>=7.10"
          coverage combine
          coverage report --fail-under=90 | tee -a "$GITHUB_STEP_SUMMARY"

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check-config

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Build every image of docker-compose.yml
        run: make build
