version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/app/api", "/app/streamlit", "/monitoring/exporter"]
    schedule:
      interval: weekly
    # the requirements are ranges: only propose a change when a release falls outside one
    versioning-strategy: increase-if-necessary
    ignore:
      # pyspark follows the Spark image and its Iceberg runtime jar; dbt needs protobuf < 7
      - dependency-name: pyspark
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: protobuf
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/app/api", "/app/streamlit", "/dagster", "/dbt", "/ingestion", "/monitoring/exporter", "/soda"]
    schedule:
      interval: weekly
    ignore:
      # a new Python minor is a deliberate move: Dagster, dbt and Soda each have to support it first
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # the Spark image moves with pyspark and the Iceberg runtime jar
      - dependency-name: apache/spark
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
