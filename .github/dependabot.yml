version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/app/api", "/app/streamlit", "/monitoring/exporter"]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/app/api", "/app/streamlit", "/dagster", "/dbt", "/ingestion", "/monitoring/exporter", "/soda"]
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
