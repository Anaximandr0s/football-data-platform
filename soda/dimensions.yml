# Every Soda check (soda/checks/*.yml) and the data-quality dimension it belongs to, with a plain-English name
# for the Data quality page. tests/soda checks that every check has an entry here, and only those.
# Dimensions: completeness (nothing missing), uniqueness (each thing once), validity (possible values),
# consistency (tables agree), accuracy (agrees with the real world). Freshness has no Soda check: it comes
# from the Dagster runs.

silver_tracking:
  "tracking follows the data contract": {dimension: validity, plain: "tracking has the columns and types of the data contract"}
  "tracking is not empty": {dimension: completeness, plain: "tracking is not empty"}
  "tracking has one row per (match_id, player_id, ts)": {dimension: uniqueness, plain: "tracking has one row per (match_id, player_id, ts)"}
  "a rejected speed (above 40 km/h in bronze) is null in Silver": {dimension: validity, plain: "an impossible speed (above 40 km/h) is removed, not kept"}
  "positions are inside the 105 x 68 pitch": {dimension: validity, plain: "positions are inside the 105 x 68 pitch"}
  "every existing second has exactly 22 players": {dimension: completeness, plain: "every second the camera saw has 22 players"}
  "is_sprint is true exactly when speed is above 25 km/h (never for a null speed)": {dimension: validity, plain: "a second counts as a sprint exactly when the speed is above 25 km/h"}
  "every tracked player exists in silver_players with the same team": {dimension: consistency, plain: "every tracked player is in the team sheet, in the same team"}
  "tracking stays inside the playing time of the player": {dimension: consistency, plain: "a player is tracked only while he is on the pitch"}
  "missing_count(match_id) = 0": {dimension: completeness, plain: "every tracking row has a match id"}
  "missing_count(player_id) = 0": {dimension: completeness, plain: "every tracking row has a player id"}
  "every tracking row has a team": {dimension: completeness, plain: "every tracking row has a team"}
  "tracking team_id is HOME or AWAY": {dimension: validity, plain: "every tracked player is HOME or AWAY"}
  "missing_count(ts) = 0": {dimension: completeness, plain: "every tracking row has a ts"}
  "missing_count(x) = 0": {dimension: completeness, plain: "every tracking row has a x"}
  "missing_count(y) = 0": {dimension: completeness, plain: "every tracking row has a y"}
  "missing_count(is_sprint) = 0": {dimension: completeness, plain: "every tracking row has a is sprint"}
  "missing_count(was_corrected) = 0": {dimension: completeness, plain: "every tracking row has a was corrected"}
  "missing_count(is_after_gap) = 0": {dimension: completeness, plain: "every tracking row has a is after gap"}
  "missing_count(is_detected) = 0": {dimension: completeness, plain: "every tracking row has a is detected"}
  "missing_count(speed_rejected) = 0": {dimension: completeness, plain: "every tracking row has a speed rejected"}
  "tracking period is 1 or 2": {dimension: validity, plain: "tracking period is 1 or 2"}
  "speed is at most 40 km/h (null allowed)": {dimension: validity, plain: "speed is at most 40 km/h (null allowed)"}
  "speed is never negative": {dimension: validity, plain: "speed is never negative"}

silver_events:
  "events follow the data contract": {dimension: validity, plain: "events has the columns and types of the data contract"}
  "row_count > 0": {dimension: completeness, plain: "events is not empty"}
  "run fields are set on runs only, and every run says if it was targeted and received": {dimension: validity, plain: "runs without the ball say if they were targeted and received"}
  "every event player exists in silver_players with the same team": {dimension: consistency, plain: "every action's player is in the team sheet, in the same team"}
  "a pass receiver is a player of the same team": {dimension: consistency, plain: "a pass receiver is a player of the same team"}
  "events are oriented per team (HOME shots toward x = 105, AWAY shots toward x = 0)": {dimension: validity, plain: "every team shoots toward the goal it attacks"}
  "goals in events equal home_score + away_score of the match": {dimension: accuracy, plain: "the goals found in the data equal the real final score"}
  "events have one row per event_id": {dimension: uniqueness, plain: "events have one row per event_id"}
  "missing_count(event_id) = 0": {dimension: completeness, plain: "every events row has a event id"}
  "missing_count(match_id) = 0": {dimension: completeness, plain: "every events row has a match id"}
  "missing_count(player_id) = 0": {dimension: completeness, plain: "every events row has a player id"}
  "missing_count(team_id) = 0": {dimension: completeness, plain: "every events row has a team id"}
  "events team_id is HOME or AWAY": {dimension: validity, plain: "events team_id is HOME or AWAY"}
  "missing_count(type) = 0": {dimension: completeness, plain: "every events row has a type"}
  "event type is one of pass, shot, goal, tackle, foul, pressure, run": {dimension: validity, plain: "every action is a pass, shot, goal, tackle, foul, pressure or run"}
  "missing_count(outcome) = 0": {dimension: completeness, plain: "every events row has a outcome"}
  "events period is 1 or 2": {dimension: validity, plain: "events period is 1 or 2"}

silver_ball:
  "ball follows the data contract": {dimension: validity, plain: "ball has the columns and types of the data contract"}
  "row_count > 0": {dimension: completeness, plain: "ball is not empty"}
  "ball has one row per (match_id, ts)": {dimension: uniqueness, plain: "ball has one row per (match_id, ts)"}
  "the ball is tracked in the same seconds as the players": {dimension: consistency, plain: "the ball is seen when the players are"}
  "missing_count(match_id) = 0": {dimension: completeness, plain: "every ball row has a match id"}
  "missing_count(ts) = 0": {dimension: completeness, plain: "every ball row has a ts"}
  "missing_count(x) = 0": {dimension: completeness, plain: "every ball row has a x"}
  "missing_count(y) = 0": {dimension: completeness, plain: "every ball row has a y"}
  "ball period is 1 or 2": {dimension: validity, plain: "ball period is 1 or 2"}
  "ball possession is HOME, AWAY or null": {dimension: validity, plain: "the ball belongs to HOME, AWAY or nobody"}

