# Soda checks on the GOLD layer (FOO-05): the Gold tables of the DuckDB file written by dbt (`make gold`): the six
# first tables and the MatchLens tables of docs/product.md, section 7.
# Columns and types: docs/contrat_donnees.md section 10. dbt already reconciles Gold with Silver (dbt/tests/assert_*.sql);
# these checks guard the published tables themselves: contract, ranges, and consistency between Gold tables.

checks for gold_player_match_stats:
  - schema:
      name: gold_player_match_stats follows the data contract
      fail:
        when required column missing: [match_id, player_id, team_id, name, short_name, position, shirt_number, minutes_on_pitch, tracked_seconds, distance_m, distance_km, sprint_seconds, sprint_count, max_speed_kmh, avg_speed_kmh, avg_x, avg_y, passes, passes_successful, passes_received, shots, goals, tackles, fouls, pressures]
        when wrong column type:
          match_id: VARCHAR
          player_id: VARCHAR
          team_id: VARCHAR
          shirt_number: INTEGER
          minutes_on_pitch: DOUBLE
          tracked_seconds: BIGINT
          distance_m: DOUBLE
          distance_km: DOUBLE
          sprint_seconds: BIGINT
          sprint_count: BIGINT
          max_speed_kmh: DOUBLE
          avg_speed_kmh: DOUBLE
          avg_x: DOUBLE
          avg_y: DOUBLE
          passes: BIGINT
          passes_successful: BIGINT
          passes_received: BIGINT
          shots: BIGINT
          goals: BIGINT
          tackles: BIGINT
          fouls: BIGINT
          pressures: BIGINT
  - row_count > 0
  - duplicate_count(match_id, player_id) = 0:
      name: one row per player per match
  - missing_count(team_id) = 0
  - missing_count(name) = 0
  - missing_count(distance_m) = 0
  - invalid_count(team_id) = 0:
      name: player team_id is HOME or AWAY
      valid values: [HOME, AWAY]
  - min(distance_m) >= 0:
      name: no negative distance
  - max(max_speed_kmh) <= 40:
      name: no speed above 40 km/h
  - failed rows:
      name: a player never runs more than 16 km in a match
      fail condition: distance_km > 16
  - failed rows:
      name: sprint efforts never exceed sprint seconds
      fail condition: sprint_count > sprint_seconds
  - failed rows:
      name: successful passes never exceed passes
      fail condition: passes_successful > passes
  - failed rows:
      name: tracked seconds never exceed the time on the pitch
      fail condition: tracked_seconds > minutes_on_pitch * 60 + 10
  - failed rows:
      name: average position is inside the pitch
      fail condition: avg_x < 0 or avg_x > 105 or avg_y < 0 or avg_y > 68

checks for gold_team_match_stats:
  - schema:
      name: gold_team_match_stats follows the data contract
      fail:
        when required column missing: [match_id, team_id, team_name, team_short, team_color, score, opponent_score, distance_km, sprint_count, sprint_seconds, max_speed_kmh, passes, passes_successful, pass_accuracy, shots, goals, tackles, fouls, pressures, avg_x, avg_y]
        when wrong column type:
          match_id: VARCHAR
          team_id: VARCHAR
          team_name: VARCHAR
          score: INTEGER
          opponent_score: INTEGER
          distance_km: DOUBLE
          sprint_count: BIGINT
          passes: BIGINT
          pass_accuracy: DOUBLE
          goals: BIGINT
          avg_x: DOUBLE
  - row_count > 0
  - duplicate_count(match_id, team_id) = 0:
      name: one row per team per match
  - invalid_count(team_id) = 0:
      name: team team_id is HOME or AWAY
      valid values: [HOME, AWAY]
  - missing_count(team_name) = 0
  - failed rows:
      name: every match has exactly two teams
      fail query: |
        select match_id, count(*) as teams from gold_team_match_stats group by match_id having count(*) != 2
  - failed rows:
      name: pass accuracy is a ratio between 0 and 1
      fail condition: pass_accuracy < 0 or pass_accuracy > 1
  - failed rows:
      name: a team scored the goals of its score
      fail condition: goals != score
  - failed rows:
      name: the two teams of a match have mirrored scores
      fail query: |
        select h.match_id, h.score as home_score, a.score as away_score
        from gold_team_match_stats h join gold_team_match_stats a on h.match_id = a.match_id
        where h.team_id = 'HOME' and a.team_id = 'AWAY'
          and (h.score != a.opponent_score or h.opponent_score != a.score)
  - failed rows:
      name: team totals equal the sum of the player rows
      fail query: |
        select t.match_id, t.team_id, t.passes as team_passes, p.passes as player_passes
        from gold_team_match_stats t
        join (select match_id, team_id, sum(passes) as passes, sum(shots) as shots, sum(goals) as goals
              from gold_player_match_stats group by match_id, team_id) p using (match_id, team_id)
        where t.passes != p.passes or t.shots != p.shots or t.goals != p.goals

checks for gold_zone_occupancy:
  - schema:
      name: gold_zone_occupancy follows the data contract
      fail:
        when required column missing: [match_id, player_id, team_id, zone_id, zone_x, zone_y, x_min, x_max, y_min, y_max, seconds, share_of_tracked_seconds]
        when wrong column type:
          match_id: VARCHAR
          player_id: VARCHAR
          zone_id: INTEGER
          zone_x: INTEGER
          zone_y: INTEGER
          x_min: DOUBLE
          seconds: BIGINT
          share_of_tracked_seconds: DOUBLE
  - row_count > 0
  - duplicate_count(match_id, player_id, zone_id) = 0:
      name: one row per player per zone per match
  - failed rows:
      name: zone ids are inside the 6 x 4 grid (0 to 23)
      fail condition: zone_id < 0 or zone_id > 23 or zone_x < 0 or zone_x > 5 or zone_y < 0 or zone_y > 3
  - failed rows:
      name: every zone cell lies inside the pitch
      fail condition: x_min < 0 or x_max > 105 or y_min < 0 or y_max > 68 or x_min >= x_max or y_min >= y_max
  - failed rows:
      name: the zone shares of a player add up to 1
      fail query: |
        select match_id, player_id, sum(share_of_tracked_seconds) as total_share from gold_zone_occupancy
        group by match_id, player_id having abs(sum(share_of_tracked_seconds) - 1) > 0.01

checks for gold_pass_network:
  - schema:
      name: gold_pass_network follows the data contract
      fail:
        when required column missing: [match_id, passer_id, receiver_id, team_id, passer_name, receiver_name, passes, passes_successful, avg_start_x, avg_start_y, avg_end_x, avg_end_y]
        when wrong column type:
          match_id: VARCHAR
          passer_id: VARCHAR
          receiver_id: VARCHAR
          passes: BIGINT
          passes_successful: BIGINT
          avg_start_x: DOUBLE
  - row_count > 0
  - duplicate_count(match_id, passer_id, receiver_id) = 0:
      name: one row per passer and receiver per match
  - missing_count(passer_id) = 0
  - missing_count(receiver_id) = 0
  - failed rows:
      name: nobody passes to himself
      fail condition: passer_id = receiver_id
  - failed rows:
      name: successful passes never exceed passes
      fail condition: passes_successful > passes
  - failed rows:
      name: network passes never exceed the passes of the player table
      fail query: |
        select n.match_id, n.passer_id, n.passes as network_passes, p.passes as player_passes
        from (select match_id, passer_id, sum(passes) as passes from gold_pass_network group by match_id, passer_id) n
        join gold_player_match_stats p on p.match_id = n.match_id and p.player_id = n.passer_id
        where n.passes > p.passes

checks for gold_shots:
  - schema:
      name: gold_shots follows the data contract
      fail:
        when required column missing: [match_id, event_id, ts, period, player_id, player_name, player_short_name, shirt_number, team_id, type, is_goal, x_start, y_start, x_end, y_end, attacking_goal_x, distance_to_goal_m, score_home_after, score_away_after]
        when wrong column type:
          match_id: VARCHAR
          event_id: VARCHAR
          ts: INTEGER
          type: VARCHAR
          is_goal: BOOLEAN
          x_start: DOUBLE
          attacking_goal_x: DOUBLE
          distance_to_goal_m: DOUBLE
          score_home_after: INTEGER
          score_away_after: INTEGER
  - row_count > 0
  - duplicate_count(event_id) = 0:
      name: one row per shot
  - missing_count(distance_to_goal_m) = 0
  - invalid_count(type) = 0:
      name: shot type is shot or goal
      valid values: [shot, goal]
  - failed rows:
      name: is_goal is true exactly for type goal
      fail condition: is_goal != (type = 'goal')
  - failed rows:
      name: HOME attacks the goal at x = 105 and AWAY the goal at x = 0
      fail condition: (team_id = 'HOME' and attacking_goal_x != 105) or (team_id = 'AWAY' and attacking_goal_x != 0)
  - failed rows:
      name: a shot is taken less than 120 m from the goal it attacks
      fail condition: distance_to_goal_m < 0 or distance_to_goal_m > 120
  - failed rows:
      name: the running score never goes down
      fail query: |
        select match_id, event_id, ts, score_home_after, score_away_after,
               lag(score_home_after) over w as previous_home, lag(score_away_after) over w as previous_away
        from gold_shots window w as (partition by match_id order by ts, event_id)
        qualify score_home_after < previous_home or score_away_after < previous_away
  - failed rows:
      name: goals in gold_shots equal the score in gold_team_match_stats
      fail query: |
        select t.match_id, t.team_id, t.score, coalesce(g.goals, 0) as goals_in_shots
        from gold_team_match_stats t
        left join (select match_id, team_id, count(*) filter (where is_goal) as goals
                   from gold_shots group by match_id, team_id) g using (match_id, team_id)
        where t.score != coalesce(g.goals, 0)
  - failed rows:
      name: the final running score is the final score
      fail query: |
        select h.match_id, h.score as home_score, a.score as away_score, s.home_last, s.away_last
        from gold_team_match_stats h
        join gold_team_match_stats a on a.match_id = h.match_id and a.team_id = 'AWAY'
        left join (select match_id, max(score_home_after) as home_last, max(score_away_after) as away_last
                   from gold_shots group by match_id) s on s.match_id = h.match_id
        where h.team_id = 'HOME' and (h.score != coalesce(s.home_last, 0) or a.score != coalesce(s.away_last, 0))

checks for gold_player_5min:
  - schema:
      name: gold_player_5min follows the data contract
      fail:
        when required column missing: [match_id, player_id, team_id, window_index, period, window_label, window_start_ts, window_end_ts, window_seconds, tracked_seconds, coverage, distance_m, sprint_seconds, max_speed_kmh, passes, shots, goals, tackles, fouls, pressures]
        when wrong column type:
          match_id: VARCHAR
          player_id: VARCHAR
          window_start_ts: INTEGER
          window_end_ts: INTEGER
          tracked_seconds: BIGINT
          coverage: DOUBLE
          distance_m: DOUBLE
          passes: BIGINT
  - row_count > 0
  - duplicate_count(match_id, player_id, window_index) = 0:
      name: one row per player per 5-minute window
  - missing_count(team_id) = 0
  - failed rows:
      name: a window lasts its own length (300 seconds, or the stoppage time for 45+ and 90+)
      fail condition: window_end_ts - window_start_ts != window_seconds or window_seconds <= 0 or (window_label not like '%+' and window_seconds > 300)
  - failed rows:
      name: coverage is tracked seconds over the window length (between 0 and 1)
      fail condition: coverage < 0 or coverage > 1 or tracked_seconds > window_seconds
  - failed rows:
      name: a player covers less than 2 km in 5 minutes
      fail condition: distance_m > 2000
  - failed rows:
      name: windows add up to the tracked seconds of the player table
      fail query: |
        select w.match_id, w.player_id, w.seconds as window_seconds, p.tracked_seconds
        from (select match_id, player_id, sum(tracked_seconds) as seconds from gold_player_5min group by match_id, player_id) w
        join gold_player_match_stats p on p.match_id = w.match_id and p.player_id = w.player_id
        where w.seconds != p.tracked_seconds

checks for gold_match_timeline:
  - schema:
      name: gold_match_timeline follows the data contract
      fail:
        when required column missing: [match_id, team_id, window_index, period, window_label, window_start_ts, window_end_ts, window_seconds, passes, final_third_passes, field_tilt, possession_seconds, known_seconds, possession_share, possession_greyed, shots, goals, defensive_actions, xthreat_successful_passes, score_home_end, score_away_end]
        when wrong column type:
          match_id: VARCHAR
          team_id: VARCHAR
          window_index: INTEGER
          window_start_ts: INTEGER
          passes: BIGINT
          field_tilt: DOUBLE
          possession_seconds: BIGINT
          possession_share: DOUBLE
          possession_greyed: BOOLEAN
          defensive_actions: BIGINT
          xthreat_successful_passes: DOUBLE
          score_home_end: INTEGER
  - row_count > 0
  - duplicate_count(match_id, team_id, window_index) = 0:
      name: one row per team per 5-minute window
  - missing_count(possession_greyed) = 0
  - failed rows:
      name: possession and field tilt are shares between 0 and 1
      fail condition: possession_share < 0 or possession_share > 1 or field_tilt < 0 or field_tilt > 1
  - failed rows:
      name: a window is greyed exactly when it has fewer than 60 known seconds
      fail condition: possession_greyed != (known_seconds < 60) or known_seconds > window_seconds
  - failed rows:
      name: the two teams of a window share the same known seconds and add up to them
      fail query: |
        select h.match_id, h.window_index, h.possession_seconds as home, a.possession_seconds as away, h.known_seconds
        from gold_match_timeline h join gold_match_timeline a using (match_id, window_index)
        where h.team_id = 'HOME' and a.team_id = 'AWAY'
          and (h.known_seconds != a.known_seconds or h.possession_seconds + a.possession_seconds != h.known_seconds)
  - failed rows:
      name: the score at the end of the last window is the final score
      fail query: |
        select t.match_id, t.score_home_end, t.score_away_end, h.score as home_score, a.score as away_score
        from gold_match_timeline t
        join gold_team_match_stats h on h.match_id = t.match_id and h.team_id = 'HOME'
        join gold_team_match_stats a on a.match_id = t.match_id and a.team_id = 'AWAY'
        where t.window_index = (select max(window_index) from gold_match_timeline w where w.match_id = t.match_id)
          and (t.score_home_end != h.score or t.score_away_end != a.score)
  - failed rows:
      name: timeline passes add up to the passes of the team table
      fail query: |
        select t.match_id, t.team_id, t.passes as timeline_passes, s.passes
        from (select match_id, team_id, sum(passes) as passes from gold_match_timeline group by 1, 2) t
        join gold_team_match_stats s using (match_id, team_id)
        where t.passes != s.passes

  - failed rows:
      name: windows restart at each kick-off (labels 0-5 ... 45+, 45-50 ... 90+)
      fail query: |
        select match_id, window_index, window_label, period from gold_match_timeline
        where (period = 1 and window_index > 9) or (period = 2 and window_index < 10)
           or (window_index in (9, 19)) != (window_label like '%+')

checks for gold_player_card:
  - schema:
      name: gold_player_card follows the data contract
      fail:
        when required column missing: [match_id, player_id, team_id, source_player_id, name, short_name, position, shirt_number, opponent_name, is_outfield, tracked_minutes, is_eligible, dpm, top_speed_kmh, sprint_count, sprints_per_min, passes_successful, passes_successful_per_min, progressive_passes, progressive_passes_successful, progressive_passes_successful_per_min, defensive_actions, defensive_actions_per_min, goals, passes_received_successful, score_work_rate, score_sprints, score_passing, score_progression, score_defending, involvement, is_hub]
        when wrong column type:
          match_id: VARCHAR
          player_id: VARCHAR
          source_player_id: BIGINT
          is_eligible: BOOLEAN
          tracked_minutes: DOUBLE
          dpm: DOUBLE
          defensive_actions: BIGINT
          score_work_rate: INTEGER
          score_defending: INTEGER
          involvement: DOUBLE
          is_hub: BOOLEAN
  - row_count > 0
  - duplicate_count(match_id, player_id) = 0:
      name: one card per player per match
  - missing_count(source_player_id) = 0
  - failed rows:
      name: an eligible player is outfield with at least 20 tracked minutes
      fail condition: is_eligible != (is_outfield and tracked_minutes >= 20)
  - failed rows:
      name: an eligible player has 5 scores between 0 and 100, the others none
      fail condition: |
        (is_eligible and (score_work_rate is null or score_sprints is null or score_passing is null
                          or score_progression is null or score_defending is null))
        or (not is_eligible and coalesce(score_work_rate, score_sprints, score_passing, score_progression, score_defending) is not null)
        or least(score_work_rate, score_sprints, score_passing, score_progression, score_defending) < 0
        or greatest(score_work_rate, score_sprints, score_passing, score_progression, score_defending) > 100
  - failed rows:
      name: involvement is a share between 0 and 1
      fail condition: involvement < 0 or involvement > 1
  - failed rows:
      name: each team with a successful pass has a hub (several only when they tie)
      fail query: |
        select match_id, team_id, count(*) filter (where is_hub) as hubs, max(involvement) as top_involvement
        from gold_player_card group by 1, 2
        having count(*) filter (where is_hub) = 0 and max(involvement) > 0
  - failed rows:
      name: the card top speed never exceeds the fastest speed of the player table
      fail query: |
        select c.match_id, c.player_id, c.top_speed_kmh, s.max_speed_kmh
        from gold_player_card c join gold_player_match_stats s using (match_id, player_id)
        where c.top_speed_kmh > round(s.max_speed_kmh, 1)
  - failed rows:
      name: the card agrees with the player table
      fail query: |
        select c.match_id, c.player_id, c.sprint_count, s.sprint_count as stats_sprints, c.goals, s.goals as stats_goals
        from gold_player_card c join gold_player_match_stats s using (match_id, player_id)
        where c.sprint_count != s.sprint_count or c.goals != s.goals or c.passes_successful != s.passes_successful
           or c.tracked_minutes != round(s.tracked_seconds / 60.0, 1)

checks for gold_team_shape:
  - schema:
      name: gold_team_shape follows the data contract
      fail:
        when required column missing: [match_id, team_id, phase, seconds_used, width, length, area, defensive_line_height, detected_share]
        when wrong column type:
          match_id: VARCHAR
          team_id: VARCHAR
          phase: VARCHAR
          seconds_used: BIGINT
          width: DOUBLE
          length: DOUBLE
          area: DOUBLE
          defensive_line_height: DOUBLE
          detected_share: DOUBLE
  - row_count > 0
  - duplicate_count(match_id, team_id, phase) = 0:
      name: one row per team per phase per match
  - invalid_count(phase) = 0:
      name: phase is in_possession, out_of_possession or unknown
      valid values: [in_possession, out_of_possession, unknown]
  - failed rows:
      name: width, length and the defensive line fit inside the pitch
      fail condition: width < 0 or width > 68 or length < 0 or length > 105 or defensive_line_height < 0 or defensive_line_height > 105 or detected_share < 0 or detected_share > 1
  - failed rows:
      name: the seconds of one team in possession are the seconds of the other out of possession
      fail query: |
        select a.match_id, a.team_id, a.seconds_used as in_possession, b.seconds_used as opponent_out_of_possession
        from gold_team_shape a
        join gold_team_shape b on b.match_id = a.match_id and b.team_id != a.team_id and b.phase = 'out_of_possession'
        where a.phase = 'in_possession' and a.seconds_used != b.seconds_used

checks for gold_pressing:
  - schema:
      name: gold_pressing follows the data contract
      fail:
        when required column missing: [match_id, team_id, window_index, period, window_label, window_start_ts, window_end_ts, window_seconds, defensive_actions, opponent_passes, ppp, ppp_greyed, defensive_actions_own_third, defensive_actions_middle_third, defensive_actions_final_third, high_press_share]
        when wrong column type:
          match_id: VARCHAR
          team_id: VARCHAR
          window_index: INTEGER
          window_start_ts: INTEGER
          defensive_actions: BIGINT
          opponent_passes: BIGINT
          ppp: DOUBLE
          ppp_greyed: BOOLEAN
          high_press_share: DOUBLE
  - row_count > 0
  - duplicate_count(match_id, team_id, window_index) = 0:
      name: one row per team per 15-minute window
  - failed rows:
      name: a 15-minute window lasts 900 seconds, or the stoppage time for 45+ and 90+
      fail condition: window_end_ts - window_start_ts != window_seconds or window_seconds <= 0 or (window_label not like '%+' and window_seconds > 900)
  - failed rows:
      name: the three thirds add up to the defensive actions
      fail condition: defensive_actions_own_third + defensive_actions_middle_third + defensive_actions_final_third > defensive_actions or high_press_share < 0 or high_press_share > 1 or ppp < 0
  - failed rows:
      name: a pressing window is greyed exactly when the opponent made fewer than 10 passes
      fail condition: ppp_greyed != (opponent_passes < 10)
  - failed rows:
      name: opponent passes add up to the passes of the opponent
      fail query: |
        select p.match_id, p.team_id, p.opponent_passes, s.passes as opponent_total
        from (select match_id, team_id, sum(opponent_passes) as opponent_passes from gold_pressing group by 1, 2) p
        join gold_team_match_stats s on s.match_id = p.match_id and s.team_id != p.team_id
        where p.opponent_passes != s.passes
  - failed rows:
      name: defensive actions are pressures, tackles and fouls, never runs
      fail query: |
        select p.match_id, p.team_id, p.defensive_actions, s.pressures + s.tackles + s.fouls as from_team_table
        from (select match_id, team_id, sum(defensive_actions) as defensive_actions from gold_pressing group by 1, 2) p
        join gold_team_match_stats s using (match_id, team_id)
        where p.defensive_actions != s.pressures + s.tackles + s.fouls

checks for gold_team_build_up:
  - schema:
      name: gold_team_build_up follows the data contract
      fail:
        when required column missing: [match_id, team_id, progressive_passes, progressive_passes_successful, tracked_minutes, progressive_passes_per90, final_third_entries, entries_left, entries_centre, entries_right, share_left, share_centre, share_right]
        when wrong column type:
          match_id: VARCHAR
          team_id: VARCHAR
          progressive_passes: BIGINT
          tracked_minutes: DOUBLE
          progressive_passes_per90: DOUBLE
          final_third_entries: BIGINT
          share_left: DOUBLE
  - row_count > 0
  - duplicate_count(match_id, team_id) = 0:
      name: one build-up row per team per match
  - failed rows:
      name: the three lanes add up to the final-third entries and their shares to 1
      fail condition: entries_left + entries_centre + entries_right != final_third_entries or (final_third_entries > 0 and abs(share_left + share_centre + share_right - 1) > 0.001)
  - failed rows:
      name: team tracked minutes are seconds of the match, not player-minutes
      fail query: |
        select b.match_id, b.team_id, b.tracked_minutes, m.p2_end_minutes
        from gold_team_build_up b
        join (select match_id, max(window_end_ts) / 60.0 as p2_end_minutes from gold_match_timeline group by 1) m using (match_id)
        where b.tracked_minutes > m.p2_end_minutes
  - failed rows:
      name: progressive passes are passes, and the successful ones are fewer
      fail query: |
        select b.match_id, b.team_id, b.progressive_passes, b.progressive_passes_successful, s.passes, s.passes_successful
        from gold_team_build_up b join gold_team_match_stats s using (match_id, team_id)
        where b.progressive_passes > s.passes or b.progressive_passes_successful > s.passes_successful
           or b.progressive_passes_successful > b.progressive_passes or b.final_third_entries > s.passes_successful

checks for gold_player_fatigue:
  - schema:
      name: gold_player_fatigue follows the data contract
      fail:
        when required column missing: [match_id, player_id, team_id, short_name, position, start_ts, end_ts, is_outfield, minutes_on_pitch, dpm_first15, dpm_last5, drop, tracked_minutes_first15, tracked_minutes_last5, is_eligible]
        when wrong column type:
          match_id: VARCHAR
          player_id: VARCHAR
          start_ts: INTEGER
          minutes_on_pitch: DOUBLE
          dpm_first15: DOUBLE
          drop: DOUBLE
          tracked_minutes_first15: DOUBLE
          is_eligible: BOOLEAN
  - row_count > 0
  - duplicate_count(match_id, player_id) = 0:
      name: one fatigue row per player per match
  - failed rows:
      name: an eligible player passes the thresholds of C6
      fail condition: is_eligible and (not is_outfield or minutes_on_pitch < 30 or tracked_minutes_first15 < 5 or tracked_minutes_last5 < 2)
  - failed rows:
      name: the windows hold at most 15 and 5 tracked minutes
      fail condition: tracked_minutes_first15 > 15 or tracked_minutes_last5 > 5 or tracked_minutes_first15 < 0
  - failed rows:
      name: an eligible player runs less than 250 m per minute in both windows
      fail condition: is_eligible and (dpm_first15 > 250 or dpm_last5 > 250 or dpm_first15 <= 0)

checks for gold_space_control:
  - schema:
      name: gold_space_control follows the data contract
      fail:
        when required column missing: [match_id, team_id, window_index, period, window_label, window_start_ts, window_end_ts, window_seconds, seconds_used, space_share, seconds_in_possession, space_share_in_possession, seconds_out_of_possession, space_share_out_of_possession, seconds_unknown, space_share_unknown, detected_share]
        when wrong column type:
          match_id: VARCHAR
          team_id: VARCHAR
          window_index: INTEGER
          seconds_used: BIGINT
          space_share: DOUBLE
          detected_share: DOUBLE
  - row_count > 0
  - duplicate_count(match_id, team_id, window_index) = 0:
      name: one space row per team per 5-minute window
  - failed rows:
      name: space shares are between 0 and 1 and the phases add up to the seconds used
      fail condition: space_share < 0 or space_share > 1 or detected_share < 0 or detected_share > 1 or seconds_used > window_seconds or seconds_in_possession + seconds_out_of_possession + seconds_unknown != seconds_used
  - failed rows:
      name: the two teams share the pitch (HOME + AWAY = 1 in every window)
      fail query: |
        select h.match_id, h.window_index, h.space_share as home, a.space_share as away
        from gold_space_control h join gold_space_control a using (match_id, window_index)
        where h.team_id = 'HOME' and a.team_id = 'AWAY' and (abs(h.space_share + a.space_share - 1) > 0.001 or h.seconds_used != a.seconds_used)
  - failed rows:
      name: space control uses every tracked second
      fail query: |
        select s.match_id, s.seconds, z.seconds as tracked_seconds
        from (select match_id, sum(seconds_used) as seconds from gold_space_control where team_id = 'HOME' group by 1) s
        join (select match_id, max(tracked_seconds) as seconds from gold_player_match_stats group by 1) z using (match_id)
        where s.seconds < z.seconds

checks for gold_team_profile:
  - schema:
      name: gold_team_profile follows the data contract
      fail:
        when required column missing: [match_id, team_id, team_name, opponent_name, possession_share, field_tilt, shots_and_goals, width, length, defensive_line_height, ppp, high_press_share, progressive_passes, progressive_passes_per90, dpm_outfield, share_left, share_centre, share_right, gap_possession_share, gap_field_tilt, gap_shots_and_goals, gap_progressive_passes, gap_ppp, gap_dpm_outfield]
        when wrong column type:
          match_id: VARCHAR
          team_id: VARCHAR
          possession_share: DOUBLE
          field_tilt: DOUBLE
          shots_and_goals: BIGINT
          ppp: DOUBLE
          dpm_outfield: DOUBLE
          gap_ppp: DOUBLE
  - row_count > 0
  - duplicate_count(match_id, team_id) = 0:
      name: one profile per team per match
  - failed rows:
      name: the two teams of a match have opposite gaps and complementary shares
      fail query: |
        select h.match_id, h.gap_possession_share, a.gap_possession_share as away_gap, h.possession_share + a.possession_share as possession_total
        from gold_team_profile h join gold_team_profile a using (match_id)
        where h.team_id = 'HOME' and a.team_id = 'AWAY'
          and (abs(h.gap_possession_share + a.gap_possession_share) > 0.001 or abs(h.gap_dpm_outfield + a.gap_dpm_outfield) > 0.001
               or abs(h.possession_share + a.possession_share - 1) > 0.001 or abs(h.field_tilt + a.field_tilt - 1) > 0.001)
  - failed rows:
      name: a gap lies between -2 and 2
      fail condition: greatest(abs(gap_possession_share), abs(gap_field_tilt), abs(gap_shots_and_goals), abs(gap_progressive_passes), abs(gap_ppp), abs(gap_dpm_outfield)) > 2
  - failed rows:
      name: the profile repeats the build-up and shot numbers of the other tables
      fail query: |
        select p.match_id, p.team_id, p.shots_and_goals, s.shots + s.goals as from_team_table, p.progressive_passes, b.progressive_passes as build_up
        from gold_team_profile p
        join gold_team_match_stats s using (match_id, team_id)
        join gold_team_build_up b using (match_id, team_id)
        where p.shots_and_goals != s.shots + s.goals or p.progressive_passes != b.progressive_passes

checks for gold_events:
  - schema:
      name: gold_events follows the data contract
      fail:
        when required column missing: [match_id, event_id, ts, period, player_id, receiver_id, team_id, type, x_start, y_start, x_end, y_end, outcome, phase, phase_against, xthreat, dangerous, speed_band, subtype, lead_to_shot, targeted, received, x_att_start, y_att_start, x_att_end, y_att_end, player_short_name, shirt_number, receiver_short_name, third, lane]
        when wrong column type:
          match_id: VARCHAR
          event_id: VARCHAR
          ts: INTEGER
          type: VARCHAR
          x_att_start: DOUBLE
          xthreat: DOUBLE
          dangerous: BOOLEAN
          third: VARCHAR
          lane: VARCHAR
  - row_count > 0
  - duplicate_count(event_id) = 0:
      name: one row per event
  - missing_count(player_short_name) = 0
  - invalid_count(third) = 0:
      name: third is own, middle or final
      valid values: [own, middle, final]
  - invalid_count(lane) = 0:
      name: lane is left, centre or right
      valid values: [left, centre, right]
  - failed rows:
      name: x_att and y_att are the Silver coordinates seen by the team of the event
      fail condition: |
        (team_id = 'HOME' and (x_att_start != x_start or y_att_start != y_start))
        or (team_id = 'AWAY' and (abs(x_att_start - (105 - x_start)) > 0.001 or abs(y_att_start - (68 - y_start)) > 0.001))
  - failed rows:
      name: every action of the player table is in gold_events, and the runs on top
      fail query: |
        select e.match_id, e.actions, s.actions as player_table
        from (select match_id, count(*) filter (where type != 'run') as actions from gold_events group by 1) e
        join (select match_id, sum(passes + shots + goals + tackles + fouls + pressures) as actions
              from gold_player_match_stats group by 1) s using (match_id)
        where e.actions != s.actions
  - failed rows:
      name: a goal has the second the ball was in the goal, within 10 s of its start; no other event has one
      fail condition: (type = 'goal' and (goal_ts is null or goal_ts < ts or goal_ts > ts + 10 or goal_ts_method not in ('ball_in_goal', 'ball_nearest_goal', 'event_start'))) or (type != 'goal' and (goal_ts is not null or goal_ts_method is not null))

checks for gold_match_library:
  - schema:
      name: gold_match_library follows the data contract
      fail:
        when required column missing: [match_id, home_team, away_team, home_team_short, away_team_short, home_color, away_color, home_score, away_score, kickoff_utc, match_date, competition, season, round, stadium, p1_start_ts, p1_end_ts, p2_start_ts, p2_end_ts, speeds_rejected, match_seconds, tracked_seconds, tracked_share]
        when wrong column type:
          match_id: VARCHAR
          home_score: INTEGER
          away_score: INTEGER
          match_date: DATE
          p1_start_ts: INTEGER
          p2_start_ts: INTEGER
          speeds_rejected: BIGINT
          match_seconds: INTEGER
          tracked_seconds: BIGINT
          tracked_share: DOUBLE
  - row_count > 0
  - duplicate_count(match_id) = 0:
      name: one library row per match
  - missing_count(match_date) = 0
  - failed rows:
      name: the tracked share is between 0 and 1
      fail condition: tracked_share < 0 or tracked_share > 1 or tracked_seconds > match_seconds
  - failed rows:
      name: the periods follow each other (p1 start <= p1 end < p2 start <= p2 end)
      fail condition: not (p1_start_ts <= p1_end_ts and p1_end_ts < p2_start_ts and p2_start_ts <= p2_end_ts)
  - failed rows:
      name: the library score is the score of the team table
      fail query: |
        select l.match_id, l.home_score, l.away_score, h.score as home_team_score, a.score as away_team_score
        from gold_match_library l
        join gold_team_match_stats h on h.match_id = l.match_id and h.team_id = 'HOME'
        join gold_team_match_stats a on a.match_id = l.match_id and a.team_id = 'AWAY'
        where l.home_score != h.score or l.away_score != a.score

checks for gold_replay_frames:
  - schema:
      name: gold_replay_frames follows the data contract
      fail:
        when required column missing: [match_id, ts, period, object_id, object_type, team_id, shirt_number, x, y, speed_kmh, is_detected, possession, home_space_share]
        when wrong column type:
          match_id: VARCHAR
          ts: INTEGER
          object_id: VARCHAR
          object_type: VARCHAR
          x: DOUBLE
          y: DOUBLE
          is_detected: BOOLEAN
          home_space_share: DOUBLE
  - row_count > 0
  - duplicate_count(match_id, ts, object_id) = 0:
      name: one replay row per object per second
  - failed rows:
      name: players are inside the pitch with a team and a shirt number; the ball has neither
      fail condition: (object_type = 'player' and (x < 0 or x > 105 or y < 0 or y > 68 or team_id is null or shirt_number is null)) or (object_type = 'ball' and (team_id is not null or object_id != 'ball')) or object_type not in ('player', 'ball')
  - failed rows:
      name: every tracked second has its ball and 22 players
      fail query: |
        select match_id, ts, count(*) filter (where object_type = 'player') as players,
               count(*) filter (where object_type = 'ball') as balls
        from gold_replay_frames group by 1, 2
        having count(*) filter (where object_type = 'player') != 22 or count(*) filter (where object_type = 'ball') != 1
  - failed rows:
      name: the replay plays every tracked second of the match
      fail query: |
        select r.match_id, r.seconds, l.tracked_seconds
        from (select match_id, count(distinct ts) as seconds from gold_replay_frames group by 1) r
        join gold_match_library l using (match_id)
        where r.seconds != l.tracked_seconds
